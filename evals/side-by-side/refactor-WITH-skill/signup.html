<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your free account - Ledgerly</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#main">Skip to main content</a>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">L</span>Ledgerly</a>
    <nav class="utils" aria-label="Site">
      <a href="index.html">Home</a>
      <a href="#">Help</a>
      <a href="#">Log in</a>
    </nav>
  </div>
</header>

<main id="main" class="formwrap">
  <h1>Create your free account</h1>
  <p class="lede">Takes under a minute. No card needed.</p>

  <form class="card formcard" action="#" method="post">
    <div class="field">
      <label for="name">Full name</label>
      <input type="text" id="name" name="n" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="e" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="p" autocomplete="new-password" minlength="8" required aria-describedby="password-hint">
      <p class="hint" id="password-hint">At least 8 characters.</p>
    </div>

    <button type="submit" class="btn btn-primary btn-lg btn-block">Create account</button>
    <p class="form-foot">Free to sign up. Payments you receive cost 3.5% each. <a href="#">Privacy policy</a></p>
  </form>

  <p class="alt">Already have an account? <a href="#">Log in</a></p>
</main>

<footer class="footer">
  <div class="wrap">
    <span>Copyright 2026 Ledgerly Inc.</span>
  </div>
</footer>

</body>
</html>
